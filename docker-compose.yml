services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cadde1905_app
    working_dir: /var/www
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
      - cadde1905_vendor_volume:/var/www/vendor
      - ./storage/app/public:/var/www/storage/app/public
      - cadde1905_storage_framework_volume:/var/www/storage/framework
      - cadde1905_storage_logs_volume:/var/www/storage/logs
      - cadde1905_cache_volume:/var/www/bootstrap/cache
      - ./docker/php/conf.d/99-parity.ini:/usr/local/etc/php/conf.d/99-parity.ini:ro
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: cadde1905_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - ./storage/app/public:/var/www/storage/app/public:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: cadde1905_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cadde1905
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: cadde
      MYSQL_PASSWORD: cadde
    ports:
      - "3307:3306"
    volumes:
      - cadde1905_db_volume:/var/lib/mysql

  node:
    image: node:20-alpine
    container_name: cadde1905_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - cadde1905_node_modules_volume:/var/www/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -lc "if [ ! -d node_modules ]; then npm install; fi;
      npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  cadde1905_db_volume:
  cadde1905_vendor_volume:
  cadde1905_storage_framework_volume:
  cadde1905_storage_logs_volume:
  cadde1905_cache_volume:
  cadde1905_node_modules_volume: