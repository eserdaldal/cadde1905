[phases.setup]
nixPkgs = ["php82", "php82Packages.composer"]

[phases.install]
cmds = ["composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs --no-scripts"]

[phases.build]
cmds = ["php artisan package:discover --ansi", "php artisan filament:upgrade", "echo 'Build Success'"]